name: Java CI and ECR Push

on:
  push:
    branches: [ "release-1.0.0" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPO: ${{ vars.AWS_ECR_REPO }}
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_SCRIPTS_BRANCH: fhir-cce-emitter-adaptor-deploy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/demo/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle
      run: ./gradlew build

    # Built from the repository Dockerfile rather than bootBuildImage: the image build no longer
    # depends on Spring Boot's own Docker client, and the image keeps a shell for debugging.
    - name: Build container image
      run: |
        ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}
        docker build -t ${ECR_URI}:latest .

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag & Push Image
      run: |
        ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}
        docker tag ${ECR_URI}:latest ${ECR_URI}:${IMAGE_TAG}
        docker push ${ECR_URI}:${IMAGE_TAG}
        docker push ${ECR_URI}:latest

    - name: Update image tag in deploy-scripts
      env:
        CI_BOT_USER: ${{ secrets.CI_BOT_USER }}
        CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      run: |
        if [ -z "${CI_BOT_USER}" ] || [ -z "${CI_BOT_TOKEN}" ]; then
          echo "::error::CI_BOT_USER and CI_BOT_TOKEN secrets must be set in GitHub repo settings"
          exit 1
        fi

        ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"

        git clone -b "${DEPLOY_SCRIPTS_BRANCH}" \
          "https://${CI_BOT_USER}:${CI_BOT_TOKEN}@bitbucket.org/MDTLabs/deploy-scripts.git" \
          deploy-scripts

        cd deploy-scripts

        sed -i "s|image: .*|image: ${ECR_URI}:${IMAGE_TAG}|" docker-compose.yml

        cat docker-compose.yml

    - name: Commit and push updated docker-compose
      env:
        CI_BOT_USER: ${{ secrets.CI_BOT_USER }}
        CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
      run: |
        cd deploy-scripts

        git config user.name "ci-bot"
        git config user.email "ci-bot@bitbucket.org"

        git remote set-url origin \
          "https://${CI_BOT_USER}:${CI_BOT_TOKEN}@bitbucket.org/MDTLabs/deploy-scripts.git"

        git add docker-compose.yml

        if git diff --cached --quiet; then
          echo "No changes to commit - image tag already up to date"
        else
          git commit -m "ci: update fhir-cce-emitter-adaptor image to ${IMAGE_TAG}"
          git push origin "${DEPLOY_SCRIPTS_BRANCH}"
          echo "Successfully updated docker-compose.yml image tag"
        fi
        ###
